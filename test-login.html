<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>
<body>
    <h1>Test Login Endpoints</h1>
    
    <h2>Test Regular Login</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" value="admin@example.com"><br>
        <input type="password" id="password" placeholder="Password" value="Admin123!"><br>
        <button type="submit">Test Login</button>
    </form>
    <pre id="loginResult"></pre>

    <h2>Server Status</h2>
    <button onclick="testHealth()">Test Health</button>
    <pre id="healthResult"></pre>

    <script>
        const API_BASE = 'http://localhost:4000/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('loginResult');
            
            try {
                result.textContent = 'Testing login...';
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                result.textContent = 'Status: ' + response.status + '\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
            }
        });

        async function testHealth() {
            const result = document.getElementById('healthResult');
            try {
                result.textContent = 'Testing health...';
                const response = await fetch('http://localhost:4000/health');
                const data = await response.json();
                result.textContent = 'Status: ' + response.status + '\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = 'Error: ' + error.message + '\n\nMake sure backend is running on port 4000';
            }
        }

        // Auto test health on load
        window.onload = testHealth;
    </script>
</body>
</html>
